<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body data-page="app">
    <header>
        <div class="brand">
            <h1><span class="icon">⚡</span><span class="hidden-mobile">Hromosvody</span><span class="chat hidden-mobile">Chat</span></h1>
        </div>
        <div class="action">

            <button id="release-btn" class="hidden">Release Username</button>
            <img id="current-user-img" class="avatar" src="" alt="Avatar" />
<div id="current-user"></div>
<input type="file" id="avatar-input" accept="image/*" />
<a  id="logout-btn"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="#fff" class="bi bi-box-arrow-right" viewBox="0 0 16 16">
  <path fill-rule="evenodd" d="M10 12.5a.5.5 0 0 1-.5.5h-8a.5.5 0 0 1-.5-.5v-9a.5.5 0 0 1 .5-.5h8a.5.5 0 0 1 .5.5v2a.5.5 0 0 0 1 0v-2A1.5 1.5 0 0 0 9.5 2h-8A1.5 1.5 0 0 0 0 3.5v9A1.5 1.5 0 0 0 1.5 14h8a1.5 1.5 0 0 0 1.5-1.5v-2a.5.5 0 0 0-1 0z"/>
  <path fill-rule="evenodd" d="M15.854 8.354a.5.5 0 0 0 0-.708l-3-3a.5.5 0 0 0-.708.708L14.293 7.5H5.5a.5.5 0 0 0 0 1h8.793l-2.147 2.146a.5.5 0 0 0 .708.708z"/>
</svg></a>
        </div>
    </header>
  <section id="chat-section">
    <div id="chat-log" class="chat-log"></div>
    <button id="new-message-banner" class="new-message hidden" type="button">1 new message</button>
    <div id="profile-modal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h3>Edit Profile</h3>
          <button class="modal-close">&times;</button>
        </div>
        <div class="modal-body">
          <div class="profile-block profile-avatar-block">
            <label>Profile Picture</label>
            <div class="avatar-upload-zone">
              <img id="profile-avatar-preview" class="avatar" src="" alt="Avatar preview" />
              <input type="file" id="profile-avatar-input" accept="image/*" />
              <button type="button" id="profile-avatar-btn" class="modal-btn">Upload Avatar</button>
            </div>
          </div>
          <div class="profile-block profile-color-block">
            <label>Profile Color</label>
            <div id="profile-colors" class="profile-colors"></div>
          </div>
          <div class="profile-block profile-desc-block">
            <label for="profile-description">Description</label>
            <textarea id="profile-description" maxlength="500" placeholder="Tell others about yourself..."></textarea>
          </div>
          <div class="profile-block profile-banner-block">
            <label>Banner Image</label>
            <div class="banner-upload-zone">
              <input type="file" id="banner-input" accept="image/*" />
              <div id="banner-preview"></div>
              <button type="button" id="banner-upload-btn" class="modal-btn">Upload Banner</button>
            </div>
          </div>
          <button type="button" id="profile-save-btn" class="modal-btn modal-btn-primary">Save</button>
        </div>
      </div>
    </div>
    <div id="user-modal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <button class="modal-close">&times;</button>
        </div>
        <div class="modal-body">
          <div id="user-banner" class="user-banner">No banner</div>
          <div class="user-profile-row">
            <img id="user-profile-avatar" class="avatar" src="" alt="Avatar" />
            <div id="user-profile-name" class="user-profile-name"></div>
          </div>
          <div id="user-profile-description" class="user-profile-description">No description</div>
        </div>
      </div>
    </div>
    <form id="chat-form">
      <input type="text" id="chat-input" maxlength="800" placeholder="Type message" required autocomplete="off" />
      <label class="image-upload">
        <input type="file" id="image-input" />
        <span>File</span>
      </label>
<button type="submit" class="button">
  <div class="button-top">Send -></div>
  <div class="button-bottom"></div>
  <div class="button-base"></div>
</button>
    </form>
    <div class="status" id="chat-status"></div>
  </section>

  <div id="mention-autocomplete" class="mention-autocomplete"></div>

  <script src="/app.js"></script>
</body>
</html>
